
name: ci

on:
  pull_request: 
    branches: [main]

jobs:
  style:
    name: styling
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set Up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Format Code
        run: npm run format:check

      - name: Linting
        run: npm run lint -- --max-warnings=0

  tests:
    name: tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set Up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Run tests
        run: npm run test -- --coverage